<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Door Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Creepster&family=Nunito:wght@600;800;900&family=Special+Elite&display=swap">
<style>
:root {
  --bg: #0b0910;
  --panel: #17121f;
  --panel2: #221a2e;
  --line: #3a2f4a;
  --text: #f3eefa;
  --dim: #a99bbd;
  --gold: #f5c542;
  --good: #4ade80;
  --bad: #f87171;
  --glow: #9b7bff;
  --padW: clamp(260px, 30vw, 420px);
  --padH: 40vh;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
[hidden] { display: none !important; }

/* ---------- HUD */
#hud { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 14px; z-index: 5; background: linear-gradient(#000c, #0000); font-weight: 900; }
#hud .pill { background: #0009; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 20px; white-space: nowrap; }
#doorLbl { font-family: Creepster, Nunito, sans-serif; letter-spacing: 2px; font-size: 26px !important; color: #ffd98a; }
#hearts { letter-spacing: 2px; }
#items { font-size: 18px !important; }
#items:empty { display: none; }
#menuBtn { background: #0009; border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 40px; font-size: 20px; }
#hud .spacer { flex: 1; }

/* ---------- keypad */
#pad { position: fixed; z-index: 4; background: linear-gradient(160deg, #1c1626, #110d17); border-left: 2px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 18px; }
#keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 380px; }
#keys button { aspect-ratio: 1.15; border-radius: 18px; border: 2px solid #4a3d5e; background: linear-gradient(#2e2440, #1f182b); font-size: clamp(28px, 4.2vmin, 46px); font-weight: 900; box-shadow: 0 5px 0 #0a0710, inset 0 1px 0 #ffffff22; transition: transform .05s; }
#keys button:active, #keys button.press { transform: translateY(4px); box-shadow: 0 1px 0 #0a0710; }
#keys .ok { background: linear-gradient(#2f9e5a, #1e6e3d); border-color: #4ade80; }
#keys .del { background: linear-gradient(#5a2d3a, #3a1c26); border-color: #a85068; font-size: clamp(22px, 3.4vmin, 36px); }
#pad.off #keys { opacity: .35; pointer-events: none; }
#keys .neg { display: none; background: linear-gradient(#2d3a5a, #1c2540); border-color: #5a78b8; }
#keys.alg .neg { display: block; grid-column: 1 / -1; aspect-ratio: auto; padding: 6px 0; font-size: clamp(20px, 3vmin, 30px); }

/* ---------- question card */
#qcard { position: fixed; z-index: 4; margin: 0 auto; width: min(640px, calc(100% - 24px)); background: #120d19ee; border: 2px solid var(--line); border-radius: 22px; padding: 12px 18px 14px; text-align: center; box-shadow: 0 10px 40px #000a, 0 0 30px #9b7bff22; }
#qmsg { min-height: 26px; font-size: clamp(16px, 2.3vmin, 22px); font-weight: 800; color: var(--dim); }
#qmsg.warn { color: #ffb347; }
#qmsg.danger { color: var(--bad); animation: pulse .6s infinite alternate; }
#qmsg.good { color: var(--good); }
#qrow { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
#qtext.long { font-size: clamp(30px, 5.6vmin, 56px); }
#qtext { font-size: clamp(40px, 7.5vmin, 76px); font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 18px #9b7bff66; }
#answer { min-width: 2.4em; font-size: clamp(40px, 7.5vmin, 76px); font-weight: 900; color: var(--gold); border-bottom: 5px solid var(--gold); padding: 0 8px; line-height: 1.1; }
#answer.blink { animation: blink 1s steps(2) infinite; }
#qcard.shake { animation: shake .35s; }
#qcard.right { border-color: var(--good); box-shadow: 0 0 40px #4ade8066; }
#bar { height: 14px; border-radius: 99px; background: #0008; border: 1px solid var(--line); margin-top: 8px; overflow: hidden; position: relative; }
#bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #f87171, #fbbf24, #4ade80); transform-origin: left; }
#bar b { position: absolute; inset: 0; font-size: 11px; line-height: 14px; letter-spacing: 1px; color: #fff; text-shadow: 0 1px 2px #000; }
#hint { margin-top: 10px; background: #1b2a1f; border: 2px solid #3d6b47; border-radius: 16px; padding: 10px 12px; text-align: left; font-size: clamp(15px, 2.2vmin, 20px); }
#hint .who { color: #f5f08a; font-weight: 900; }
#hint .dots { display: grid; gap: 3px; justify-content: center; margin: 8px auto 4px; }
#hint .dots span { width: var(--d); height: var(--d); border-radius: 50%; background: #8fd3ff; }
#hint .dots span.b { background: #ffb36b; }
#hint .dots span.x { background: #555; opacity: .45; position: relative; }
#hint .dots span.gap { background: none; }
#hint .big { font-size: 1.25em; font-weight: 900; color: var(--gold); }

@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-14px) } 40% { transform: translateX(12px) } 60% { transform: translateX(-8px) } 80% { transform: translateX(5px) } }
@keyframes pulse { from { opacity: 1 } to { opacity: .55 } }
@keyframes blink { 50% { border-color: transparent } }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }

@media (min-aspect-ratio: 11/10) {
  #pad { top: 0; right: 0; bottom: 0; width: var(--padW); }
  #qcard { left: 0; right: var(--padW); bottom: 2.5vh; width: min(640px, calc(100% - var(--padW) - 24px)); }
  #hud { right: var(--padW); }
  #toast { right: var(--padW); }
}
@media (max-aspect-ratio: 11/10) {
  #pad { left: 0; right: 0; bottom: 0; height: var(--padH); border-left: 0; border-top: 2px solid var(--line); padding: 10px 16px; }
  #keys { max-width: 460px; gap: 8px; }
  #keys button { aspect-ratio: 2; }
  #keys.alg button { aspect-ratio: 2.6; }
  #qcard { left: 0; right: 0; bottom: calc(var(--padH) + 1vh); }
}

/* ---------- toasts */
#toast { position: fixed; top: 64px; left: 0; right: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
#toast div { background: #000c; border: 2px solid var(--glow); border-radius: 999px; padding: 8px 20px; font-size: clamp(16px, 2.4vmin, 22px); font-weight: 900; animation: pop .25s ease-out; transition: opacity .4s; }
#toast div.gold { border-color: var(--gold); color: var(--gold); }
#toast div.bad { border-color: var(--bad); }

/* ---------- full screens */
.screen { position: fixed; inset: 0; z-index: 10; overflow: auto; background: radial-gradient(ellipse at 50% 20%, #2a1f3fd0, #0b0910f4 70%); display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; animation: pop .25s ease-out; }
.screen h1 { font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: clamp(56px, 12vmin, 130px); margin: 2vh 0 0; letter-spacing: 4px; color: #ffd98a; text-shadow: 0 0 30px #ff9d0066, 0 6px 0 #5a2d00; line-height: 1; }
.screen h2 { font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: clamp(36px, 7vmin, 64px); margin: 8px 0; letter-spacing: 2px; color: #ffd98a; }
.screen .tag { color: var(--dim); font-size: clamp(16px, 2.6vmin, 22px); margin: 6px 0 22px; text-align: center; max-width: 640px; }
.btn { border-radius: 18px; border: 2px solid #6a55a0; background: linear-gradient(#3b2d5c, #251c3b); padding: 14px 28px; font-size: clamp(20px, 3vmin, 28px); font-weight: 900; box-shadow: 0 5px 0 #0a0710; min-width: 220px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0a0710; }
.btn.go { background: linear-gradient(#e0a42e, #a8701a); border-color: #ffd98a; color: #1a1205; }
.btn.small { min-width: 0; padding: 10px 18px; font-size: clamp(16px, 2.3vmin, 20px); }
.btn:disabled { opacity: .4; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 6px 0 14px; }
.chip { border-radius: 999px; border: 2px solid var(--line); background: var(--panel2); padding: 10px 20px; font-size: clamp(16px, 2.4vmin, 21px); font-weight: 800; }
.chip.on { border-color: var(--gold); background: #3a2d12; color: #ffe39a; }
.chip small { display: block; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
.chip.on small { color: #e8c877; }
.label { color: var(--dim); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-size: 14px; margin-top: 10px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 16px 18px; width: min(720px, 100%); margin: 8px 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; width: min(900px, 100%); }
.badge { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; font-size: 14px; color: var(--dim); }
.badge b { display: block; font-size: 34px; }
.badge.got { border-color: var(--gold); color: var(--text); }
.badge:not(.got) b { filter: grayscale(1) brightness(.4); }
.grid { display: grid; gap: 3px; margin: 8px auto; font-size: 13px; font-weight: 800; }
.grid div { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: #221a2e; color: #0009; min-width: 0; }
.grid .h { background: none; color: var(--dim); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--dim); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; text-align: center; }
.stats div { background: var(--panel2); border-radius: 14px; padding: 10px; }
.stats b { display: block; font-size: 28px; color: var(--gold); }
.shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; width: min(820px, 100%); }
.shop button { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 14px; text-align: center; }
.shop button b { display: block; font-size: 44px; }
.shop button strong { display: block; font-size: 20px; margin: 4px 0; }
.shop button span { display: block; color: var(--dim); font-size: 15px; min-height: 40px; }
.shop button em { display: inline-block; margin-top: 8px; font-style: normal; font-weight: 900; color: var(--gold); font-size: 20px; }
.shop button:disabled { opacity: .4; }
.players { display: grid; gap: 10px; width: min(560px, 100%); }
.player { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.player.on { border-color: var(--gold); }
.player .who { flex: 1; text-align: left; background: none; border: 0; padding: 4px; font-size: clamp(20px, 3vmin, 26px); font-weight: 900; }
.player .who small { display: block; color: var(--dim); font-size: 14px; font-weight: 800; }
.screen input { user-select: text; -webkit-user-select: text; font: inherit; font-size: 22px; font-weight: 800; color: var(--text); background: var(--panel2); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; width: min(320px, 100%); }
.flex { width: min(720px, 100%); border-collapse: collapse; font-size: clamp(15px, 2.2vmin, 19px); }
.flex th { color: var(--dim); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; text-align: left; padding: 6px 8px; }
.flex td { background: var(--panel); padding: 10px 8px; border-top: 2px solid var(--bg); }
.flex td:first-child { border-radius: 14px 0 0 14px; font-weight: 900; }
.flex td:last-child { border-radius: 0 14px 14px 0; }
.skills { display: grid; gap: 6px; text-align: left; }
.skills div { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.skills i { width: 14px; height: 14px; border-radius: 4px; flex: none; background: var(--c); }
/* ---------- Monster Files book */
.tabs { display: flex; gap: 8px; margin: 4px 0 14px; }
.book { --paper: #efe1c0; --ink: #2b1a0e; --faded: #7a6143; position: relative; width: min(980px, 100%); display: grid; grid-template-columns: 1fr 1fr; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, #5a2e16, #3a1c0c 60%, #2a1308); box-shadow: 0 18px 50px #000c, inset 0 0 0 3px #7a4524, inset 0 0 0 7px #3a1c0c; perspective: 2200px; }
.page { position: relative; min-height: min(62vh, 560px); padding: 26px 30px 44px; color: var(--ink); background: radial-gradient(ellipse at 30% 20%, #f7ecd2, transparent 60%), radial-gradient(circle at 80% 85%, #d9c294 0, transparent 35%), radial-gradient(circle at 12% 78%, #e3cfa3 0, transparent 22%), var(--paper); overflow: hidden; }
.page.l { border-radius: 10px 2px 2px 10px; box-shadow: inset -22px 0 30px -18px #6b4a2299; }
.page.r { border-radius: 2px 10px 10px 2px; box-shadow: inset 22px 0 30px -18px #6b4a2299; }
.page .num { position: absolute; bottom: 14px; font-family: "Special Elite", monospace; font-size: 14px; color: var(--faded); }
.page.l .num { left: 26px; } .page.r .num { right: 26px; }
.page .lbl { font-family: "Special Elite", monospace; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--faded); }
.page h3 { font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: clamp(40px, 7vmin, 64px); letter-spacing: 2px; margin: 4px 0 6px; line-height: 1; color: #3a1608; }
.page .hand { font-family: Caveat, cursive; font-size: clamp(22px, 3.2vmin, 28px); line-height: 1.2; margin: 6px 0; }
.page .fact { display: flex; gap: 10px; align-items: baseline; margin: 10px 0 0; }
.page .fact .lbl { flex: none; width: 92px; }
.photo { position: relative; margin: 22px auto 10px; width: min(300px, 90%); aspect-ratio: 1; background: #1a1220; border: 10px solid #fbf6ea; border-bottom-width: 34px; box-shadow: 0 6px 16px #0006; transform: rotate(-2.5deg); }
.photo canvas { width: 100%; height: 100%; display: block; }
.photo .cap { position: absolute; left: 0; right: 0; bottom: -30px; text-align: center; font-family: Caveat, cursive; font-size: 24px; color: #3a2a1a; }
.tape { position: absolute; width: 90px; height: 26px; background: #f3e9a8aa; top: -14px; left: 50%; transform: translateX(-50%) rotate(3deg); box-shadow: 0 1px 2px #0002; }
.stamp { position: absolute; top: 22px; right: 22px; transform: rotate(9deg); border: 4px solid currentColor; border-radius: 8px; padding: 2px 10px; font-family: "Special Elite", monospace; font-size: 22px; letter-spacing: 3px; opacity: .78; }
.stamp.bad { color: #b3261e; } .stamp.good { color: #2f7a3a; }
.skulls { font-size: 22px; letter-spacing: 2px; }
.skulls i { font-style: normal; opacity: .2; }
.blot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Creepster, sans-serif; font-size: 120px; color: #6b5a7a; }
.scrib { height: 14px; margin: 12px 0; border-radius: 7px; background: #2b1a0e22; }
.flip { position: absolute; z-index: 3; width: 72px; height: 72px; top: 50%; margin-top: -36px; border-radius: 50%; border: 3px solid #7a4524; background: #3a1c0cee; color: #ffd98a; font-size: 34px; font-weight: 900; box-shadow: 0 4px 12px #000a; }
.flip:disabled { opacity: .25; }
.flip.prev { left: -44px; } .flip.next { right: -44px; }
@media (max-width: 1099px) {
  .book { margin-bottom: 46px; }
  .flip { top: auto; bottom: -40px; margin-top: 0; }
  .flip.prev { left: calc(50% - 90px); } .flip.next { right: calc(50% - 90px); }
}
.leaf { position: absolute; z-index: 2; top: 14px; bottom: 14px; width: calc(50% - 14px); background: var(--paper); backface-visibility: hidden; pointer-events: none; }
.leaf.fwd { left: 50%; transform-origin: left center; border-radius: 2px 10px 10px 2px; animation: leafFwd .5s ease-in-out forwards; }
.leaf.back { left: 14px; transform-origin: right center; border-radius: 10px 2px 2px 10px; animation: leafBack .5s ease-in-out forwards; }
@keyframes leafFwd { from { transform: rotateY(0); filter: brightness(1) } to { transform: rotateY(-180deg); filter: brightness(.6) } }
@keyframes leafBack { from { transform: rotateY(0); filter: brightness(1) } to { transform: rotateY(180deg); filter: brightness(.6) } }
.toc { display: grid; gap: 4px; margin-top: 12px; }
.toc button { display: flex; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 2px dotted #2b1a0e33; padding: 6px 2px; font-family: Caveat, cursive; font-size: 26px; color: var(--ink); }
.toc button span { flex: 1; }
.toc button small { font-family: "Special Elite", monospace; font-size: 14px; color: var(--faded); }
@media (max-width: 760px) {
  .book { grid-template-columns: 1fr; padding: 10px; }
  .page { min-height: 0; padding: 20px 20px 40px; }
  .page.l, .page.r { border-radius: 10px; box-shadow: inset 0 0 30px -10px #6b4a2299; }
  .page.l { border-bottom: 2px dashed #6b4a2255; border-radius: 10px 10px 0 0; }
  .page.r { border-radius: 0 0 10px 10px; }
  .photo { width: min(220px, 70%); margin-top: 14px; }
  .leaf { display: none; }
}
#qtext.story { font-size: clamp(20px, 3.4vmin, 32px); line-height: 1.25; max-width: 30em; }
.mq { font-size: clamp(36px, 7vmin, 64px); font-weight: 900; text-shadow: 0 0 18px #9b7bff66; margin: 0 0 8px; text-align: center; }
.doorpick button { background: none; border: 0; padding: 6px; }
.lift { display: grid; grid-template-columns: repeat(3, auto); gap: 14px; padding: 18px; margin-top: 8px; background: linear-gradient(#3a2c1a, #24190e); border: 4px solid #b08d3c; border-radius: 18px; }
.lift button { width: clamp(64px, 14vmin, 92px); height: clamp(64px, 14vmin, 92px); border-radius: 50%; border: 4px solid #b08d3c; background: radial-gradient(circle at 40% 35%, #fff6d0, #e0b850 60%, #9c7a2c); font: 900 clamp(20px, 4.6vmin, 32px) Nunito, sans-serif; color: #3a2508; box-shadow: 0 4px 0 #5a4313; cursor: pointer; }
.lift button:disabled { opacity: .28; cursor: default; }
.lift button.lit { background: radial-gradient(circle, #fffbe0, #ffd84d); box-shadow: 0 0 26px #ffd84d; }
.doorpick canvas { width: clamp(130px, 28vmin, 220px); height: auto; display: block; }
#keys.jumbled button[data-home] { border-color: #6bd36b; box-shadow: 0 5px 0 #0a0710, 0 0 14px #6bd36b55; }
.mirrors { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 10px; max-width: 900px; }
.mirrors button { min-width: clamp(150px, 26vmin, 240px); padding: 28px 18px; border-radius: 50% / 42%; border: 8px solid #c9a24a; background: linear-gradient(135deg, #7a8ca3, #25303f); color: #f4f8ff; font: 900 clamp(20px, 4vmin, 34px) Nunito, sans-serif; box-shadow: 0 0 22px #9b7bff44, inset 0 0 24px #ffffff22; cursor: pointer; }
.mirrors button.true { opacity: .45; border-color: #4ade80; cursor: default; }
.mirrors button.lie { background: linear-gradient(135deg, #ffe0e0, #ff6b6b); color: #3a0606; }
.bubbles { position: relative; width: min(92vw, 640px); height: 50vh; margin-top: 6px; border-radius: 22px; background: linear-gradient(#0b1a2a00, #1a3a5a88); overflow: hidden; }
.bubbles button { position: absolute; left: 0; top: 0; width: clamp(74px, 15vmin, 112px); aspect-ratio: 1; border-radius: 50%; border: 3px solid #cfefff; background: radial-gradient(circle at 35% 30%, #ffffffcc 0 10%, #9fd8ff55 30%, #3a8fd033 70%); color: #fff; font: 900 clamp(22px, 5vmin, 36px) Nunito, sans-serif; text-shadow: 0 2px 6px #000; box-shadow: 0 0 18px #7fc8ff66; cursor: pointer; }
.bubbles button.pop { opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
.toll { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 30px; }
.toll .owe { font: 900 clamp(44px, 9vmin, 80px) Nunito, sans-serif; color: var(--gold); text-shadow: 0 0 18px #ff9d0055; }
.toll .tray { min-height: 64px; min-width: min(90vw, 520px); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; padding: 10px; border-radius: 18px; background: #0d1210cc; border: 3px dashed #5a6b5f; }
.toll .tray i { font-style: normal; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; font: 900 13px Nunito, sans-serif; color: #2a1d05; background: radial-gradient(circle at 35% 30%, #fff3c4, #d9a93c 70%); }
.toll .tray i.cu { background: radial-gradient(circle at 35% 30%, #ffd2a8, #b8652a 70%); }
.toll .tray i.ag { background: radial-gradient(circle at 35% 30%, #ffffff, #a9b1bb 70%); }
.toll .tray i.bill { width: 58px; border-radius: 6px; background: linear-gradient(#cfe8c8, #7fae74); }
.toll .sum { font: 900 clamp(22px, 4vmin, 32px) Nunito, sans-serif; }
.toll .sum.over { color: var(--bad); }

   ===================================================================== */

let P = { list: [{ id: "p1", name: "" }], cur: "p1" };
try { const saved = JSON.parse(localStorage.getItem(PKEY)); if (saved && Array.isArray(saved.list) && saved.list.length) P = saved; } catch {}

const curPlayer = () => P.list.find(x => x.id === P.cur) || P.list[0];
function fresh() {

    settings: { mode: "times", tables: "auto", sound: true, nightmare: false, chapter: 1 },
    facts: {},            // key -> { box 0..4, seen, right }
    tier: { plus: 1, times: 3, alg: 2 },
    recent: { plus: [], times: [], alg: [] },
    due: [],              // missed facts come back a few doors later
    q: 0,
    ms: [],               // recent first-try answer times
    met: {}, seen: {}, badges: {},
    counts: { hides: 0, bonus: 0, escapes: 0, runs: 0, gold: 0, fastRow: 0, mimic: 0, bones: 0, ding: 0, cinder: 0, grimy: 0, hoot: 0 },
    days: {},             // yyyy-mm-dd -> { n, ok }
    best: null,

function load(id) {

    const saved = JSON.parse(localStorage.getItem(saveKey(id)));

      for (const k of ["settings", "counts", "tier", "recent"]) s[k] = Object.assign(fresh()[k], saved[k]);

}

function save() { try { localStorage.setItem(saveKey(P.cur), JSON.stringify(S)); } catch {} }

/* =====================================================================
   Math: facts, adaptive picking, hints.
   ===================================================================== */
const ORDER = [2, 10, 5, 3, 4, 11, 6, 9, 8, 7, 12];
const PLUS_TOP = 4;
const BOX_W = [6, 4, 2, 1, 0.35];
const recentKeys = [];

function fact(key) { return S.facts[key] || (S.facts[key] = { box: 0, seen: 0, right: 0 }); }
function boxOf(key) { return S.facts[key] ? S.facts[key].box : 0; }
function mkey(a, b) { return `m:${Math.min(a, b)}x${Math.max(a, b)}`; }
function tables() {
  const t = S.settings.tables;
  if (Array.isArray(t) && t.length) return t.slice();
  return ORDER.slice(0, S.tier.times);
}
function customTables() { return Array.isArray(S.settings.tables) && S.settings.tables.length > 0; }
function median(a) { if (!a.length) return 5000; const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; }
function speed() { return clamp(median(S.ms), 1500, 12000) / 1000; } // typical seconds per answer

function weighted(items) {
  let total = 0; for (const it of items) total += it.w;
  let r = Math.random() * total;
  for (const it of items) { r -= it.w; if (r <= 0) return it; }
  return items[items.length - 1];
}

function mulQ(t, b, level) {
  const swap = Math.random() < 0.3;
  return { key: mkey(t, b), mode: "times", level, a: t, b, op: "×", text: swap ? `${b} × ${t}` : `${t} × ${b}`, answer: t * b, table: t };
}
function divQ(t, b) {
  return { key: `d:${t * b}/${t}`, mode: "times", level: 0, a: t * b, b: t, op: "÷", text: `${t * b} ÷ ${t}`, answer: b, table: t };
}
function addQ(a, b, level) {
  if (Math.random() < 0.5) [a, b] = [b, a];
  return { key: `a:${Math.min(a, b)}+${Math.max(a, b)}`, mode: "plus", level, a, b, op: "+", text: `${a} + ${b}`, answer: a + b };
}
function subQ(c, b, level) {
  return { key: `s:${c}-${b}`, mode: "plus", level, a: c, b, op: "−", text: `${c} − ${b}`, answer: c - b };
}
function bigQ(level) {
  let a, b, op = Math.random() < 0.55 ? "+" : "−";
  if (level === 3) { a = rint(12, 89); b = rint(3, 9); }
  else { a = rint(15, 89); b = rint(11, op === "+" ? Math.min(89, 140 - a) : a - 3); }
  if (op === "−" && b > a) [a, b] = [b, a];
  return { key: `p${level}`, track: false, mode: "plus", level, a, b, op, text: `${a} ${op} ${b}`, answer: op === "+" ? a + b : a - b };
}
/** Grade 4 Mystery Numbers: the same fact with one number hidden. Mastery stays on the fact. */
function mystery(q) {
  const { a, b, op } = q;
  let text, answer, reveal;
  if (op === "×") { const t = q.table, o = q.b, p = t * o; text = Math.random() < 0.5 ? `${t} × ? = ${p}` : `? × ${t} = ${p}`; answer = o; reveal = text.replace("?", o); }
  else if (op === "÷") { text = `? ÷ ${b} = ${q.answer}`; answer = a; reveal = `${a} ÷ ${b} = ${q.answer}`; }
  else if (op === "+") { text = `${a} + ? = ${a + b}`; answer = b; reveal = `${a} + ${b} = ${a + b}`; }
  else if (op === "−") { text = Math.random() < 0.5 ? `${a} − ? = ${a - b}` : `? − ${b} = ${a - b}`; answer = text.startsWith("?") ? a : b; reveal = `${a} − ${b} = ${a - b}`; }
  else return q;
  return { ...q, missing: true, text, ask: text, reveal, answer };
}
function fromKey(key) {
  let m;
  if ((m = key.match(/^m:(\d+)x(\d+)$/))) { const a = +m[1], b = +m[2]; const ts = tables(); const t = ts.includes(b) ? b : a; return mulQ(t, t === a ? b : a, 0); }
  if ((m = key.match(/^d:(\d+)\/(\d+)$/))) return divQ(+m[2], +m[1] / +m[2]);
  if ((m = key.match(/^a:(\d+)\+(\d+)$/))) return addQ(+m[1], +m[2], 0);
  if ((m = key.match(/^s:(\d+)-(\d+)$/))) return subQ(+m[1], +m[2], 0);
  if ((m = key.match(/^g:(\w+)$/)) && ALG_GEN[m[1]]) return algQ(m[1], 0);
  return null;
}

function timesPool(opts) {
  const ts = tables(), newest = ts[ts.length - 1], seen = new Map();
  for (const t of ts) for (let b = 1; b <= 12; b++) {
    const key = mkey(t, b); if (seen.has(key)) continue;
    const box = boxOf(key);
    let w = BOX_W[box];
    if (!customTables() && (t === newest || b === newest) && ts.length > 1) w *= 2.5;
    if (opts.easy) w = box >= 2 ? 3 : (b <= 5 || t <= 5 ? 1 : 0.15);
    if (b === 1 || b === 0) w *= 0.3;
    seen.set(key, { w, t, b, level: (t === newest || b === newest) ? S.tier.times : 0 });
  }
  return [...seen.values()];
}
function genTimes(opts) {
  const ts = tables();
  // Hard drawers stretch one table ahead of where he is, with the big partners
  if (opts.hard) { const next = ORDER.find(t => !ts.includes(t)); return mulQ(pick(next ? [...ts, next, next] : ts), rint(6, 12), -1); }
  if (!opts.easy && S.tier.times >= 5 && Math.random() < 0.2) {
    const strong = [];
    for (const t of ts) for (let b = 2; b <= 12; b++) if (boxOf(mkey(t, b)) >= 3) strong.push([t, b]);
    if (strong.length) { const [t, b] = pick(strong); return divQ(t, b); }
  }
  const pool = timesPool(opts), unseen = pool.filter(x => !recentKeys.includes(mkey(x.t, x.b)));
  const it = weighted(unseen.length ? unseen : pool);
  return mulQ(it.t, it.b, it.level);
}

function plusPool(level, opts) {
  const out = [];
  const w = key => opts.easy ? (boxOf(key) >= 2 ? 3 : 0.5) : BOX_W[boxOf(key)];
  if (level === 1) {
    for (let a = 1; a <= 9; a++) for (let b = a; a + b <= 10; b++) out.push({ q: () => addQ(a, b, 1), key: `a:${a}+${b}` });
    for (let c = 3; c <= 10; c++) for (let b = 1; b < c; b++) out.push({ q: () => subQ(c, b, 1), key: `s:${c}-${b}` });
  } else {
    for (let a = 2; a <= 10; a++) for (let b = a; b <= 10; b++) if (a + b > 10) out.push({ q: () => addQ(a, b, 2), key: `a:${a}+${b}` });
    for (let c = 11; c <= 20; c++) for (let b = c - 10; b <= 10; b++) if (b >= 2) out.push({ q: () => subQ(c, b, 2), key: `s:${c}-${b}` });
  }
  for (const it of out) it.w = recentKeys.includes(it.key) ? 0.001 : w(it.key);
  return out;
}
function genPlus(opts) {
  const top = S.tier.plus;
  let level = Math.random() < 0.65 ? top : rint(1, top);
  if (opts.hard) level = Math.min(PLUS_TOP, top + 1);
  if (opts.easy) level = Math.min(2, Math.max(1, top - 1));
  if (level >= 3) return bigQ(level);
  return weighted(plusPool(level, opts)).q();
}

/* ---------- Pre-algebra: whole-number answers, negatives allowed. Each skill
   makes a fresh problem every time, so mastery is tracked per skill. */
const num = n => n < 0 ? `−${-n}` : `${n}`;            // −5
const par = n => n < 0 ? `(−${-n})` : `${n}`;          // 3 − (−5)
const nz = (a, b) => { let v; do v = rint(a, b); while (!v); return v; };
const term = (a, v = "x") => a === 1 ? v : a === -1 ? `−${v}` : `${num(a)}${v}`;   // 3x, −x
const plusMinus = b => b < 0 ? `− ${-b}` : `+ ${b}`;   // "+ 4" / "− 4"
const ALG = [
  { id: "int", name: "Adding & subtracting negatives", ex: "−7 + 12" },
  { id: "mul", name: "Multiplying & dividing negatives", ex: "−6 × 7" },
  { id: "ops", name: "Order of operations & exponents", ex: "(3 − 8)²" },
  { id: "eq1", name: "One-step equations", ex: "−3x = 21" },
  { id: "pct", name: "Percents, fractions & ratios", ex: "15% of 60" },
  { id: "eq2", name: "Two-step equations", ex: "3x − 7 = 14" },
  { id: "dist", name: "Distribute, combine & plug in", ex: "4(x − 3) = 20" },
  { id: "both", name: "x on both sides", ex: "5x − 3 = 2x + 12" },
];
const ALG_GEN = {
  int() {
    let a, b, op, ans;
    do { a = nz(-15, 15); b = nz(-15, 15); op = pick(["+", "−"]); ans = op === "+" ? a + b : a - b; } while (a > 0 && b > 0 && ans > 0);
    const move = op === "+" ? b : -b;
    const steps = op === "−" && b < 0 ? [`Subtracting a negative is adding: ${num(a)} + ${-b}.`]
      : op === "+" && b < 0 ? [`Adding a negative is subtracting: ${num(a)} − ${-b}.`]
      : [];
    steps.push(`Start at ${num(a)} on the number line and move ${Math.abs(move)} to the ${move > 0 ? "right" : "left"}. You land on ${num(ans)}.`);
    return { text: `${num(a)} ${op} ${par(b)}`, answer: ans, steps };
  },
  mul() {
    let a, b; do { a = nz(-12, 12); b = nz(-12, 12); } while (a > 0 && b > 0 || Math.abs(a) < 2 || Math.abs(b) < 2);
    const sign = ans => ans > 0 ? "Same signs, so the answer is positive." : "Different signs, so the answer is negative.";
    if (Math.random() < 0.5) return { text: `${num(a)} × ${par(b)}`, answer: a * b, steps: [`Ignore the signs: ${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(a * b)}.`, sign(a * b)] };
    return { text: `${num(a * b)} ÷ ${par(b)}`, answer: a, steps: [`Ignore the signs: ${Math.abs(a * b)} ÷ ${Math.abs(b)} = ${Math.abs(a)}.`, sign(a)] };
  },
  ops() {
    const a = rint(2, 9), b = rint(2, 9), c = rint(2, 12);
    return pick([
      () => ({ text: `${c} + ${a} × ${b}`, answer: c + a * b, steps: [`Multiply before you add: ${a} × ${b} = ${a * b}.`, `Then ${c} + ${a * b} = ${c + a * b}.`] }),
      () => ({ text: `${c} − ${a} × ${b}`, answer: c - a * b, steps: [`Multiply first: ${a} × ${b} = ${a * b}.`, `Then ${c} − ${a * b} = ${num(c - a * b)}.`] }),
      () => ({ text: `(${c} − ${a}) × ${b}`, answer: (c - a) * b, steps: [`Parentheses first: ${c} − ${a} = ${num(c - a)}.`, `Then ${num(c - a)} × ${b} = ${num((c - a) * b)}.`] }),
      () => ({ text: `${a}² + ${c}`, answer: a * a + c, steps: [`Exponent first: ${a}² = ${a} × ${a} = ${a * a}.`, `Then ${a * a} + ${c} = ${a * a + c}.`] }),
      () => ({ text: `${c} − ${a}²`, answer: c - a * a, steps: [`Exponent first: ${a}² = ${a * a}.`, `Then ${c} − ${a * a} = ${num(c - a * a)}.`] }),
      () => ({ text: `(${a} − ${b + a})²`, answer: b * b, steps: [`Parentheses first: ${a} − ${b + a} = −${b}.`, `Then (−${b})² = −${b} × −${b} = ${b * b}. Negative times negative is positive.`] }),
      () => { const k = rint(2, 4); return { text: `${k}³ − ${c}`, answer: k ** 3 - c, steps: [`${k}³ = ${k} × ${k} × ${k} = ${k ** 3}.`, `Then ${k ** 3} − ${c} = ${num(k ** 3 - c)}.`] }; },
      () => ({ text: `${a * b} ÷ ${a} + ${c} × 2`, answer: b + c * 2, steps: [`Divide and multiply first, left to right: ${a * b} ÷ ${a} = ${b} and ${c} × 2 = ${c * 2}.`, `Then ${b} + ${c * 2} = ${b + c * 2}.`] }),
    ])();
  },
  eq1() {
    const x = nz(-12, 15);
    return pick([
      () => { const b = nz(-12, 12), c = x + b; return { eq: `x ${plusMinus(b)} = ${num(c)}`, answer: x, steps: [`Undo the ${plusMinus(b)}: ${b > 0 ? "subtract" : "add"} ${Math.abs(b)} on both sides.`, `x = ${num(c)} ${b > 0 ? "−" : "+"} ${Math.abs(b)} = ${num(x)}.`] }; },
      () => { let a; do a = nz(-9, 9); while (Math.abs(a) < 2); return { eq: `${term(a)} = ${num(a * x)}`, answer: x, steps: [`${term(a)} means ${num(a)} times x. Undo it: divide both sides by ${num(a)}.`, `x = ${num(a * x)} ÷ ${par(a)} = ${num(x)}.`] }; },
      () => { const a = rint(2, 6); return { eq: `x ÷ ${a} = ${num(x)}`, answer: a * x, steps: [`Undo the ÷ ${a}: multiply both sides by ${a}.`, `x = ${num(x)} × ${a} = ${num(a * x)}.`] }; },
    ])();
  },
  pct() {
    return pick([
      () => {
        const p = pick([10, 20, 25, 50, 75, 5, 15, 30, 40, 60]), unit = 100 / gcd(p, 100), n = unit * rint(1, Math.max(1, Math.floor(400 / unit)));
        const ans = n * p / 100;
        const how = p === 50 ? `50% is half: ${n} ÷ 2 = ${ans}.` : p === 25 ? `25% is a quarter: ${n} ÷ 4 = ${ans}.` : p === 75 ? `75% is three quarters: ${n} ÷ 4 = ${n / 4}, × 3 = ${ans}.`
          : p === 5 ? `10% of ${n} is ${n / 10}. 5% is half of that: ${ans}.` : `10% of ${n} is ${n / 10}. ${p}% is ${p / 10} of those: ${p / 10} × ${n / 10} = ${ans}.`;
        return { text: `${p}% of ${n}`, answer: ans, steps: [how] };
      },
      () => { const b = rint(3, 8), a = rint(1, b - 1), k = rint(2, 12), n = b * k; return { text: `${a}/${b} of ${n}`, answer: a * k, steps: [`Split ${n} into ${b} equal parts: ${n} ÷ ${b} = ${k}.`, `Take ${a} of them: ${a} × ${k} = ${a * k}.`] }; },
      () => { const a = rint(2, 9), b = (a + rint(1, 7)) % 9 + 2, k = rint(2, 9); return { text: `${a} : ${b} = ${a * k} : ?`, ask: `${a} : ${b} = ${a * k} :`, reveal: `${a} : ${b} = ${a * k} : ${b * k}`, answer: b * k, steps: [`${a} became ${a * k}, so everything got multiplied by ${k}.`, `${b} × ${k} = ${b * k}.`] }; },
    ])();
  },
  eq2() {
    const x = nz(-10, 12);
    if (Math.random() < 0.3) {
      const a = rint(2, 5), b = nz(-12, 12), c = x * a;
      return { eq: `x ÷ ${a} ${plusMinus(b)} = ${num(x + b)}`, answer: c, steps: [`Undo the ${plusMinus(b)} first: x ÷ ${a} = ${num(x)}.`, `Then multiply by ${a}: x = ${num(c)}.`] };
    }
    let a; do a = nz(-9, 9); while (Math.abs(a) < 2);
    const b = nz(-20, 20), c = a * x + b;
    return { eq: `${term(a)} ${plusMinus(b)} = ${num(c)}`, answer: x, steps: [`Undo the ${plusMinus(b)} first: ${term(a)} = ${num(c - b)}.`, `Then divide by ${num(a)}: x = ${num(c - b)} ÷ ${par(a)} = ${num(x)}.`] };
  },
  dist() {
    const x = nz(-10, 10);
    return pick([

/** Your sneakers on the path. scene.edge 0..1 slides them toward the grass on scene.edgeSide. */

/** Andy's edges for the final chase: the lawn grows in from the sides and the scythe swings closer. */
function drawAndyEdges(box, near, t) {
  if (near <= 0.01) return;
  const reach = box.w * 0.3 * near;

/** Chapter 4: the office. Carpet, drop ceiling with buzzing lights, cubicle walls, sticky notes everywhere. */
function drawCubicles(box, g, doorNum, open) {
  const { bx, by, bw, bh } = g, L = box.x, R = box.x + box.w, T = box.y, B = box.y + box.h, t = GT / 1000;
  poly([L, T, R, T, bx + bw, by, bx, by], "#1b1e24");
  poly([L, B, bx, by + bh, bx + bw, by + bh, R, B], "#262c3a");
  poly([L, T, bx, by, bx, by + bh, L, B], "#3a3f48");
  poly([R, T, bx + bw, by, bx + bw, by + bh, R, B], "#3a3f48");
  // ceiling tiles
  ctx.strokeStyle = "#00000055"; ctx.lineWidth = 2;
  for (let i = 1; i < 6; i++) { const f = i / 6; ctx.beginPath(); ctx.moveTo(L + (R - L) * f, T); ctx.lineTo(bx + bw * f, by); ctx.stroke(); }
  for (let i = 1; i < 5; i++) { const f = Math.pow(i / 5, 1.3), y = T + (by - T) * f, x0 = L + (bx - L) * f, x1 = R + (bx + bw - R) * f; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
  // fluorescent panels, one of them on the fritz
  const buzz = Math.sin(t * 37) > 0.7 && Math.sin(t * 3.1) > 0.4 ? 0.25 : 1;
  for (const [f, lit] of [[0.3, 1], [0.62, buzz]]) {
    const y = T + (by - T) * f, hw = ((R - L) / 2) * (1 - f) * 0.35 + bw * 0.12 * f, hh = (by - T) * 0.05;
    ctx.fillStyle = `rgba(225,240,255,${0.25 + 0.7 * lit * scene.light})`; rr(g.cx - hw, y - hh, hw * 2, hh * 2, 3); ctx.fill();
  }
  // carpet speckle
  ctx.fillStyle = "#ffffff0a";
  for (let i = 0; i < 60; i++) { const fx = ((i * 157) % 101) / 101, fy = Math.pow(((i * 89) % 97) / 97, 1.5); const y = by + bh + (B - by - bh) * fy, hw = bw / 2 + ((R - L) / 2 - bw / 2) * fy; ctx.fillRect(g.cx - hw + fx * hw * 2, y, 3, 2); }
  // back wall and sticky notes on it
  ctx.fillStyle = "#454b55"; ctx.fillRect(bx, by, bw, bh);
  const NOTE = ["#ffe66b", "#ff9ec7", "#8fe3ff", "#b6f28a"];
  for (let i = 0; i < 9; i++) {
    const nx = bx + bw * (0.06 + ((i * 0.37) % 1) * 0.12 + (i % 2 ? 0.74 : 0)), ny = by + bh * (0.18 + ((i * 0.23) % 1) * 0.4), ns = bw * 0.045;
    ctx.save(); ctx.translate(nx, ny); ctx.rotate(Math.sin(i * 7) * 0.2); ctx.fillStyle = NOTE[i % 4]; ctx.fillRect(-ns / 2, -ns / 2, ns, ns); ctx.restore();
  }
  // cubicle partitions down both sides
  for (const side of [-1, 1]) for (const [f1, f2] of [[0.08, 0.3], [0.42, 0.6], [0.7, 0.82]]) {
    const X = f => side < 0 ? L + (bx - L) * f : R + (bx + bw - R) * f, Yb = f => B + (by + bh - B) * f, H = f => (B - T) * 0.42 * (1 - f) + bh * 0.42 * f;
    poly([X(f1), Yb(f1) - H(f1), X(f2), Yb(f2) - H(f2), X(f2), Yb(f2), X(f1), Yb(f1)], "#5d6878");
    ctx.strokeStyle = "#2b313b"; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = "#8a94a3"; poly([X(f1), Yb(f1) - H(f1), X(f2), Yb(f2) - H(f2), X(f2), Yb(f2) - H(f2) * 0.95, X(f1), Yb(f1) - H(f1) * 0.95], "#8a94a3");
  }
  // a water cooler by the door
  const wx = bx + bw * 0.86, wy = by + bh, ws = bh / 300;
  ctx.fillStyle = "#d9dde3"; rr(wx - 22 * ws, wy - 90 * ws, 44 * ws, 90 * ws, 4); ctx.fill();
  ctx.fillStyle = "#7fc8ffaa"; rr(wx - 18 * ws, wy - 150 * ws, 36 * ws, 62 * ws, 14 * ws); ctx.fill();
  const bub = (t * 0.7) % 1; ctx.fillStyle = "#ffffffaa"; ctx.beginPath(); ctx.arc(wx, wy - 95 * ws - bub * 50 * ws, 3 * ws, 0, Math.PI * 2); ctx.fill();
  drawDoor(g, doorNum, open);

  lg.addColorStop(0, `rgba(200,225,255,${0.22 * scene.light * buzz})`); lg.addColorStop(1, "rgba(200,225,255,0)");
  ctx.fillStyle = lg; ctx.fillRect(L, T, R - L, B - T);
  return g;
}

/** Drone: a tall black humanoid whose face is a stack of sticky notes. near 0..1 makes the notes flutter harder. */
function drawDrone(x, y, s, t, near = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const sway = Math.sin(t * 1.1) * 4, NOTE = ["#ffe66b", "#ff9ec7", "#8fe3ff", "#b6f28a"];
  ctx.fillStyle = "#0d0d12"; ctx.shadowColor = "#7a8cff"; ctx.shadowBlur = 14;
  // long thin legs and arms, a narrow body
  ctx.fillRect(-20, 40, 12, 150); ctx.fillRect(8, 40, 12, 150);
  rr(-32, -90, 64, 140, 18); ctx.fill();
  ctx.strokeStyle = "#0d0d12"; ctx.lineWidth = 10; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-30, -76); ctx.lineTo(-56, -10); ctx.lineTo(-50 + sway, 60); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(30, -76); ctx.lineTo(62, -40); ctx.lineTo(84, -70 - sway); ctx.stroke();
  ctx.fillRect(-6, -110, 12, 24);
  ctx.shadowBlur = 0;

    ctx.fillStyle = NOTE[(i * 3) % 4]; ctx.fillRect(-16, -16, 32, 32);
    ctx.fillStyle = "#00000022"; ctx.fillRect(-16, 12, 32, 4);
    ctx.fillStyle = "#16161c"; ctx.strokeStyle = "#16161c"; ctx.lineWidth = 3;

/** Chapter 5: Da Void. Nothing but stars and static, bits of the old hallway drifting past, and doors floating on chunks of floor. */

/** Orbi: a little black hole with a glowing ring, hungry for numbers. pull 0..1 widens the mouth and spins the ring faster. */
function drawOrbi(x, y, s, t, pull = 0) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 1.1) * 5); ctx.scale(s, s);
  const spin = t * (0.8 + pull * 3);
  const ring = (front) => {
    // a solid glowing band, then bright bits racing around it

    ctx.beginPath(); ctx.ellipse(0, 0, 106, 34, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2); ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
    ctx.save(); ctx.rotate(-0.25); ctx.scale(1, 0.32);

      const a = spin + (i / 40) * Math.PI * 2, sn = Math.sin(a);

  ctx.fillStyle = "#050308"; ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffcf8a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI * 2); ctx.stroke();
  // happy crescent eyes and a round little mouth
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.lineCap = "round";
  for (const ex of [-20, 20]) { ctx.beginPath(); ctx.arc(ex, -10, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  ctx.fillStyle = "#2a1a40"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 22, 8 + pull * 10, 6 + pull * 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.restore();
}

/** Clonk: a big red brute built from toy bricks. No eyes at all: his whole face is a mouth, and he hunts by sound. Brick-block hands. listen 0..1 tilts his head and shows the sound he's hearing. */
function drawClonk(x, y, s, t, listen = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

    ctx.fillStyle = "#ffffff22"; ctx.fillRect(bx + 3, by + 3, w - 6, 5);

  // body: rows of bricks, staggered like a wall
  for (let r = 0; r < 4; r++) for (const [bx, w] of r % 2 ? [[-90, 26], [-62, 54], [-6, 54], [50, 26]] : [[-90, 54], [-34, 54], [22, 54]]) brick(bx, -70 + r * 36, w, 34);
  studs(-90, -70, 166, 4);

    const ax = side < 0 ? -112 : 86, sw = side < 0 ? sway : -sway;
    brick(ax, -60 + sw * 0.5, 26, 40, DK); brick(ax, -18 + sw, 26, 40, DK);
    const hx = ax - 16, hy = 26 + sw * 1.5;
    brick(hx, hy, 58, 46, "#f05a28"); studs(hx, hy, 58, 2, "#f05a28");
  };
  arm(-1); arm(1);

  ctx.save(); ctx.translate(0, -78); ctx.rotate(listen * 0.22 * Math.sin(t * 2));
  brick(-70, -110, 140, 108); studs(-70, -110, 140, 4);
  ctx.fillStyle = "#2a0606"; rr(-58, -96, 116, 82, 10); ctx.fill();
  ctx.fillStyle = "#ff8f8f"; rr(-40, -40, 80, 20, 8); ctx.fill();

  }
  ctx.restore();
  ctx.restore();
}

/** Lumi: a tiny glowing jelly that drifts through the void and lights the way. */

/** Smudge: the giant eraser that made the void. Everything he rubs goes blank. */
function drawSmudge(x, y, s, t) {

  ctx.fillStyle = "#4f7fd8"; rr(30, -70, 90, 140, 26); ctx.fill(); ctx.fillRect(30, -70, 30, 140);
  ctx.fillStyle = "#ffffff33"; rr(-110, -62, 220, 18, 9); ctx.fill();
  ctx.fillStyle = "#c2537a"; rr(-120, 46, 150, 24, 12); ctx.fill();

  ctx.restore();

/** Smudge's chase: blank paper-white rubs in from both sides, and pink crumbs fly. */
function drawSmudgeEdges(box, near, t) {
  if (near <= 0.01) return;
  const reach = box.w * 0.34 * near;
  for (const side of [0, 1]) {
    const x0 = side ? box.x + box.w : box.x;
    ctx.fillStyle = "#efe9df"; ctx.beginPath(); ctx.moveTo(x0, box.y);
    for (let i = 0; i <= 18; i++) { const y = box.y + (box.h * i) / 18, wob = Math.sin(i * 2.1 + t * 5 + side * 2) * 22 + Math.sin(t * 9 + i) * 8; ctx.lineTo(side ? x0 - reach - wob : x0 + reach + wob, y); }
    ctx.lineTo(x0, box.y + box.h); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#d9cfc2"; ctx.lineWidth = 10; ctx.lineCap = "round";
    for (let k = 0; k < 4; k++) { const yy = box.y + box.h * (0.15 + k * 0.22), xx = side ? x0 - reach * 0.5 : x0 + reach * 0.5; ctx.beginPath(); ctx.moveTo(xx - reach * 0.3, yy); ctx.lineTo(xx + reach * 0.3, yy + 14); ctx.stroke(); }
  }
  ctx.fillStyle = "#f3a6c3";
  for (let i = 0; i < 40 * near; i++) { const p = (t * 0.9 + i * 0.137) % 1, side = i % 2, ex = side ? box.x + box.w - reach * (0.6 + p) : box.x + reach * (0.6 + p); ctx.fillRect(ex + Math.sin(i * 5) * 20, box.y + ((i * 53) % 100) / 100 * box.h + p * 30, 7, 5); }
  if (near > 0.4) drawSmudge(box.x + box.w - reach * 0.75, box.y + box.h * 0.55, (Math.min(box.w, box.h) / 700) * (0.5 + near * 0.8), t);
}

function drawHall(box, doorNum, open) {
  const g = geo(box), { bx, by, bw, bh } = g, L = box.x, R = box.x + box.w, T = box.y, B = box.y + box.h;
  if (scene.ch === 3) return drawGrounds(box, g, doorNum, open);
  if (scene.ch === 4) return drawCubicles(box, g, doorNum, open);
  if (scene.ch === 5) return drawVoid(box, g, doorNum, open);
  const B2 = scene.ch === 2;   // Chapter 2: the basement (concrete, pipes, a green bulb)
  // ceiling, floor, walls
  poly([L, T, R, T, bx + bw, by, bx, by], B2 ? "#0c110f" : "#120e19");
  poly([L, B, bx, by + bh, bx + bw, by + bh, R, B], B2 ? "#191d1a" : "#1d1420");
  poly([L, T, bx, by, bx, by + bh, L, B], B2 ? "#26302b" : "#2b2138");
  poly([R, T, bx + bw, by, bx + bw, by + bh, R, B], B2 ? "#26302b" : "#2b2138");
  // floorboards and wallpaper stripes toward the back wall
  ctx.strokeStyle = "#0000004d"; ctx.lineWidth = 2;
  for (let i = 1; i < 8; i++) {
    const f = i / 8;
    ctx.beginPath(); ctx.moveTo(L + (R - L) * f, B); ctx.lineTo(bx + bw * f, by + bh); ctx.stroke();
  }
  for (let i = 1; i < 6; i++) {
    const f = i / 6, lx = L + (bx - L) * f, ly1 = T + (by - T) * f, ly2 = B + (by + bh - B) * f;
    ctx.strokeStyle = "#ffffff0d"; ctx.beginPath(); ctx.moveTo(lx, ly1); ctx.lineTo(lx, ly2); ctx.stroke();
    const rx = R + (bx + bw - R) * f;
    ctx.beginPath(); ctx.moveTo(rx, ly1); ctx.lineTo(rx, ly2); ctx.stroke();
  }
  // wainscot line (a rusty pipe in the basement)
  ctx.strokeStyle = B2 ? "#6b4a2c" : "#5a3d2a"; ctx.lineWidth = B2 ? 7 : 3;
  ctx.beginPath(); ctx.moveTo(L, B - (B - T) * 0.32); ctx.lineTo(bx, by + bh * 0.68); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(R, B - (B - T) * 0.32); ctx.lineTo(bx + bw, by + bh * 0.68); ctx.stroke();
  // back wall
  ctx.fillStyle = B2 ? "#2e3a34" : "#33283f"; ctx.fillRect(bx, by, bw, bh);
  if (B2) {
    // cinder blocks on the back wall, pipes along the ceiling, a puddle where the rug was
    ctx.strokeStyle = "#0000003a"; ctx.lineWidth = 2;
    for (let r = 1; r < 10; r++) { const y = by + (bh * r) / 10; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + bw, y); ctx.stroke();
      for (let c = 0; c < 4; c++) { const x = bx + bw * ((c + (r % 2) * 0.5) / 4); ctx.beginPath(); ctx.moveTo(x, y - bh / 10); ctx.lineTo(x, y); ctx.stroke(); } }
    for (const [f, w, col] of [[0.16, 0.05, "#7a5634"], [0.3, 0.035, "#4f5a55"]]) {
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(4, (R - L) * w * 0.35);
      ctx.beginPath(); ctx.moveTo(L, T + (B - T) * f * 0.5); ctx.lineTo(bx, by + bh * f * 0.25); ctx.lineTo(bx + bw, by + bh * f * 0.25); ctx.lineTo(R, T + (B - T) * f * 0.5); ctx.stroke();
    }
    ctx.fillStyle = "#3b5e6a55"; ctx.beginPath(); ctx.ellipse(g.cx, by + bh + (B - by - bh) * 0.45, (R - L) * 0.22, (B - by - bh) * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    // a drip from the pipe
    const dp = (GT / 1400) % 1, dxp = bx + bw * 0.8, dy0 = by + bh * 0.06;
    ctx.fillStyle = "#9fd0dc"; ctx.beginPath(); ctx.ellipse(dxp, dy0 + dp * dp * (bh * 0.94), 3, 5, 0, 0, Math.PI * 2); ctx.fill();
  } else
  // rug
  poly([g.cx - bw * 0.22, by + bh, g.cx + bw * 0.22, by + bh, g.cx + (R - L) * 0.2, B, g.cx - (R - L) * 0.2, B], "#4a1626");
  // side doors (decor) on the walls
  for (const side of [-1, 1]) {
    const f1 = 0.35, f2 = 0.62;
    const xa = side < 0 ? L + (bx - L) * f1 : R + (bx + bw - R) * f1, xb = side < 0 ? L + (bx - L) * f2 : R + (bx + bw - R) * f2;
    const ya1 = T + (by - T) * f1 + (B - T) * 0.12, ya2 = B + (by + bh - B) * f1;
    const yb1 = T + (by - T) * f2 + (B - T) * 0.09, yb2 = B + (by + bh - B) * f2;
    poly([xa, ya1, xb, yb1, xb, yb2, xa, ya2], B2 ? "#3a423e" : "#24180f");
    ctx.strokeStyle = "#0008"; ctx.lineWidth = 2; ctx.stroke();
  }
  drawDoor(g, doorNum, open);
  // lamp
  const lx = g.cx, ly = T + (by - T) * 0.55;
  const flick = scene.light;
  const grad = ctx.createRadialGradient(lx, ly, 4, lx, ly + bh * 0.3, bh * 0.9);
  const glow = B2 ? "190,255,200" : "255,214,140";
  grad.addColorStop(0, `rgba(${glow},${0.32 * flick})`); grad.addColorStop(1, `rgba(${glow},0)`);
  ctx.fillStyle = grad; ctx.fillRect(L, T, R - L, B - T);
  ctx.fillStyle = flick > 0.4 ? (B2 ? "#d8ffd8" : "#ffe2a8") : "#3b3326"; ctx.beginPath(); ctx.ellipse(lx, ly, bw * 0.08, bw * 0.03, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, T); ctx.lineTo(lx, ly); ctx.stroke();
  return g;
}

function drawDoor(g, num, open) {
  const { dx, dy, dw, dh } = g;
  // what's behind: the next hallway glow
  const inner = ctx.createLinearGradient(dx, dy, dx, dy + dh);
  inner.addColorStop(0, "#0a0710"); inner.addColorStop(1, scene.view === "chase" ? "#1a0f2a" : "#2a2016");
  ctx.fillStyle = inner; ctx.fillRect(dx, dy, dw, dh);
  if (open > 0.05) {
    ctx.fillStyle = `rgba(255,200,120,${0.25 * open})`;
    ctx.beginPath(); ctx.moveTo(dx + dw * 0.3, dy + dh); ctx.lineTo(dx + dw * 0.7, dy + dh); ctx.lineTo(dx + dw * 0.55, dy + dh * 0.35); ctx.lineTo(dx + dw * 0.45, dy + dh * 0.35); ctx.fill();
  }
  // frame
  ctx.fillStyle = "#1a110a"; ctx.fillRect(dx - dw * 0.08, dy - dw * 0.08, dw * 1.16, dw * 0.08); ctx.fillRect(dx - dw * 0.08, dy, dw * 0.08, dh); ctx.fillRect(dx + dw, dy, dw * 0.08, dh);
  // door panel swings in on the left hinge
  const pw = dw * (1 - open * 0.88);
  if (pw > 1) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + pw, dy + dh * 0.04 * open); ctx.lineTo(dx + pw, dy + dh * (1 - 0.04 * open)); ctx.lineTo(dx, dy + dh); ctx.closePath();
    const wood = ctx.createLinearGradient(dx, 0, dx + pw, 0);
    if (scene.ch === 2) { wood.addColorStop(0, "#5f6b66"); wood.addColorStop(1, "#3b4541"); }
    else if (scene.ch === 3) { wood.addColorStop(0, "#8a6f45"); wood.addColorStop(1, "#5c4628"); }
    else if (scene.ch === 4) { wood.addColorStop(0, "#8b939e"); wood.addColorStop(1, "#5d646e"); }
    else if (scene.ch === 5) { wood.addColorStop(0, "#4b3d78"); wood.addColorStop(1, "#2a2148"); }
    else { wood.addColorStop(0, "#6b4426"); wood.addColorStop(1, "#4d2f19"); }
    ctx.fillStyle = wood; ctx.fill(); ctx.clip();
    ctx.strokeStyle = "#2e1a0c"; ctx.lineWidth = Math.max(2, dw * 0.02);
    const k = pw / dw;
    for (const [px, py, w, h] of [[0.14, 0.08, 0.72, 0.36], [0.14, 0.52, 0.72, 0.4]]) { rr(dx + dw * px * k, dy + dh * py, dw * w * k, dh * h, 6); ctx.stroke(); }
    if (open < 0.3) {
      // number plate
      const s = scene.ch === 2 ? "B" + String(num).padStart(2, "0") : scene.ch === 3 ? "G" + String(num).padStart(2, "0") : scene.ch === 4 ? "R" + String(num).padStart(2, "0") : scene.ch === 5 ? "V" + String(num).padStart(2, "0") : String(num).padStart(3, "0");
      const pwid = dw * 0.44, ph = dw * 0.16, ppx = dx + (dw - pwid) / 2, ppy = dy + dh * 0.14;
      const V5 = scene.ch === 5;   // the void's plates glow
      if (V5) { ctx.shadowColor = "#7af0ff"; ctx.shadowBlur = 18; }
      ctx.fillStyle = V5 ? "#7af0ff" : "#c9a24a"; rr(ppx, ppy, pwid, ph, 6); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = V5 ? "#d8fbff" : "#7d5f1f"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = V5 ? "#06222e" : "#3a2508"; ctx.font = `900 ${ph * 0.75}px Nunito, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(s, dx + dw / 2, ppy + ph * 0.54);
      // keypad lock with status light
      const kx = dx + dw * 0.7, ky = dy + dh * 0.5, kw = dw * 0.18, kh = dw * 0.26;
      ctx.fillStyle = "#1b1b22"; rr(kx, ky, kw, kh, 4); ctx.fill();
      ctx.fillStyle = "#3a3a48";
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) ctx.fillRect(kx + kw * (0.14 + c * 0.27), ky + kh * (0.32 + r * 0.21), kw * 0.18, kh * 0.13);
      const led = scene.led || "#ff4d4d";
      ctx.fillStyle = led; ctx.shadowColor = led; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(kx + kw / 2, ky + kh * 0.15, kw * 0.1, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      // knob
      ctx.fillStyle = "#d8b45a"; ctx.beginPath(); ctx.arc(dx + dw * 0.82, dy + dh * 0.85 - dh * 0.25, dw * 0.045, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  if (num === LAST_DOOR && open < 0.3 && scene.view !== "title") {
    ctx.fillStyle = "#4ade80"; ctx.font = `900 ${dw * 0.12}px Nunito, sans-serif`; ctx.textAlign = "center";
    ctx.fillText("EXIT", dx + dw / 2, dy - dw * 0.14);
  }
}

function drawStatic(x, y, r, t) {
  ctx.save();
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * r * (0.85 + 0.15 * Math.sin(t * 20 + i));
    const v = rint(60, 230);
    ctx.fillStyle = `rgb(${v},${v},${v + 15})`;
    ctx.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.9, r * 0.09, r * 0.07);
  }
  ctx.fillStyle = "#fff";
  for (const ex of [-0.32, 0.32]) { ctx.fillRect(x + ex * r - r * 0.12, y - r * 0.28, r * 0.24, r * 0.2); }
  ctx.fillStyle = "#000";
  for (const ex of [-0.32, 0.32]) { ctx.fillRect(x + ex * r - r * 0.04 + Math.sin(t * 9) * r * 0.03, y - r * 0.24, r * 0.08, r * 0.1); }
  ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(2, r * 0.05); ctx.beginPath();
  for (let i = 0; i <= 8; i++) ctx.lineTo(x - r * 0.45 + i * r * 0.1125, y + r * 0.22 + (i % 2 ? r * 0.12 : 0));
  ctx.stroke();
  ctx.restore();
}

function drawGrinny(x, y, s, { eyes = 1, body = true, slump = 0 } = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(slump * 0.35);
  if (body) {
    ctx.fillStyle = "#6b3f8f"; rr(-48, 50, 96, 110, 26); ctx.fill();          // purple vest
    ctx.fillStyle = "#3f8f3a"; rr(-80, 62, 30, 80, 14); ctx.fill(); rr(50, 62, 30, 80, 14); ctx.fill();
    ctx.fillStyle = "#f5c542"; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 78 + i * 24, 5, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.fillStyle = "#3f8f3a"; ctx.beginPath(); ctx.ellipse(0, -6, 62, 50, 0, 0, Math.PI * 2); ctx.fill();

/** Track down the middle of the hall, with a side track and the switch lever on the left. */
function drawRails(box, g, a, lever) {
  const B = box.y + box.h, floor = g.by + g.bh, spread = box.w * 0.16;
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  ctx.strokeStyle = "#3a2a1c"; ctx.lineWidth = 6;
  for (let i = 0; i < 9; i++) { const f = Math.pow(i / 8, 1.6), y = floor + (B - floor) * f, w = g.bw * 0.13 + (spread * 1.3 - g.bw * 0.13) * f; ctx.beginPath(); ctx.moveTo(g.cx - w, y); ctx.lineTo(g.cx + w, y); ctx.stroke(); }
  ctx.strokeStyle = "#8f9aa3"; ctx.lineWidth = 4;
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(g.cx + sd * g.bw * 0.1, floor); ctx.lineTo(g.cx + sd * spread, B); ctx.stroke(); }
  // side track curving off to the right wall
  ctx.strokeStyle = lever >= 1 ? "#f5c542" : "#5d666e";
  for (const off of [0, 1]) { ctx.beginPath(); ctx.moveTo(g.cx + spread * (0.55 + off * 0.45), B - (B - floor) * 0.1); ctx.quadraticCurveTo(g.cx + spread * 1.6, B - (B - floor) * 0.45, box.x + box.w, floor + (B - floor) * (0.25 + off * 0.12)); ctx.stroke(); }
  // lever: tilts from left to right as codes go in
  const lx = box.x + box.w * 0.14, ly = B - box.h * 0.08, ang = -0.7 + clamp(lever, 0, 1) * 1.4, len = box.h * 0.22;
  ctx.fillStyle = "#2b2b30"; rr(lx - 22, ly - 8, 44, 18, 4); ctx.fill();
  ctx.strokeStyle = "#b8bec4"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + Math.sin(ang) * len, ly - Math.cos(ang) * len); ctx.stroke();
  ctx.fillStyle = "#d0342c"; ctx.beginPath(); ctx.arc(lx + Math.sin(ang) * len, ly - Math.cos(ang) * len, 12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

  drawSwipe(x, g.dy + g.dh * 0.7, g.dh / 360, t, 1, scene.sack);
  ctx.restore();
}

/** Peeper: very tall, lamp shade for a head, one eye. look 0 = back turned, 1 = staring at you. */
function drawPeeper(x, y, s, t, look = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const sway = Math.sin(t * 1.1) * 4;
  // red spotlight when it's looking
  if (look > 0.4) { ctx.fillStyle = `rgba(255,50,50,${0.16 * look})`; poly([sway - 30, -60, sway + 30, -60, 160, 270, -160, 270], `rgba(255,50,50,${0.16 * look})`); }
  ctx.strokeStyle = "#1c1822"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-12, 120); ctx.lineTo(-24, 260); ctx.moveTo(12, 120); ctx.lineTo(24, 260); ctx.stroke();     // stilt legs
  poly([-20, -10, 20, -10, 40, 140, -40, 140], "#3a3044");                                       // long coat
  ctx.strokeStyle = "#3a3044"; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-44, 150); ctx.moveTo(18, 0); ctx.lineTo(44, 150); ctx.stroke();
  ctx.fillStyle = "#d9d2c2"; for (const sx of [-1, 1]) for (let f = 0; f < 3; f++) { ctx.beginPath(); ctx.ellipse(sx * 44 + (f - 1) * 4, 164, 2.5, 12, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = "#d9d2c2"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(sway, -60); ctx.stroke();     // neck
  ctx.translate(sway, -60);
  // lamp shade head: dull from behind, glowing from the front
  poly([-44, 0, 44, 0, 26, -70, -26, -70], look > 0.5 ? "#f0e2b6" : "#7d6f55");
  ctx.strokeStyle = look > 0.5 ? "#c9b27a" : "#5a4f3b"; ctx.lineWidth = 3;
  for (let i = -36; i <= 36; i += 9) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 10); ctx.stroke(); }                    // fringe
  if (look < 0.5) { for (const sx of [-14, 0, 14]) { ctx.beginPath(); ctx.moveTo(sx * 1.4, -2); ctx.lineTo(sx, -68); ctx.stroke(); } }
  const a = clamp((look - 0.3) / 0.7, 0, 1);
  if (a > 0) {
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.ellipse(0, -32, 24, 17 * a, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(230,40,40,${a})`; ctx.shadowColor = "#ff2a2a"; ctx.shadowBlur = 26 * a;
    ctx.beginPath(); ctx.arc(Math.sin(t * 2) * 4, -32, 10 * a, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(Math.sin(t * 2) * 4, -32, 4 * a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/** Munch: a couch-sized termite in a hard hat he did not earn. */
function drawMunch(x, y, s, t, chew = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const c = Math.abs(Math.sin(t * 10)) * chew;
  // legs
  ctx.strokeStyle = "#9c7443"; ctx.lineWidth = 6; ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) { const lx = -6 + i * 34, k = Math.sin(t * 8 + i) * 6; ctx.beginPath(); ctx.moveTo(lx, 20); ctx.lineTo(lx - 14 + k, 46); ctx.lineTo(lx - 22 + k, 58); ctx.stroke(); }
  // abdomen and thorax
  ctx.fillStyle = "#e7c088"; ctx.beginPath(); ctx.ellipse(72, 10, 54, 38, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#c9995a"; ctx.lineWidth = 4; for (const sx of [52, 72, 92]) { ctx.beginPath(); ctx.ellipse(sx, 10, 8, 32, 0.1, -1.2, 1.2); ctx.stroke(); }
  ctx.fillStyle = "#dcb47c"; ctx.beginPath(); ctx.ellipse(8, 8, 30, 26, 0, 0, Math.PI * 2); ctx.fill();
  // antennae
  ctx.strokeStyle = "#9c7443"; ctx.lineWidth = 4;
  for (const [ax, tip] of [[-58, -96], [-30, -100]]) { ctx.beginPath(); ctx.moveTo(ax, -36); ctx.quadraticCurveTo(ax - 20 + Math.sin(t * 3) * 6, -70, ax - 10 + Math.sin(t * 3 + ax) * 8, tip); ctx.stroke(); ctx.fillStyle = "#9c7443"; ctx.beginPath(); ctx.arc(ax - 10 + Math.sin(t * 3 + ax) * 8, tip, 5, 0, Math.PI * 2); ctx.fill(); }
  // big head
  ctx.fillStyle = "#f0cc94"; ctx.beginPath(); ctx.ellipse(-46, -4, 42, 38, 0, 0, Math.PI * 2); ctx.fill();
  for (const ex of [-62, -32]) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, -14, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(ex - 2, -10, 6, 0, Math.PI * 2); ctx.fill();
  }
  // chomping buck teeth
  ctx.fillStyle = "#4a2a14"; rr(-66, 16, 40, 8 + c * 10, 4); ctx.fill();
  ctx.fillStyle = "#fffbe8"; rr(-62, 12, 15, 14 + c * 4, 3); ctx.fill(); rr(-45, 12, 15, 14 + c * 4, 3); ctx.fill();
  // sawdust
  ctx.fillStyle = "#c9a066"; for (let i = 0; i < 6; i++) { const p = (t * 1.5 + i / 6) % 1; ctx.fillRect(-56 + Math.sin(i * 7) * 24, 30 + p * 40, 4, 4); }
  // the hard hat
  ctx.fillStyle = "#f5c542"; ctx.beginPath(); ctx.arc(-46, -34, 30, Math.PI, 0); ctx.fill(); rr(-82, -38, 72, 9, 4); ctx.fill();
  ctx.fillStyle = "#d9a520"; ctx.fillRect(-50, -62, 8, 26);
  ctx.restore();
}
/** The hole Munch is eating in the floor, and the planks you've nailed down so far (from your feet toward the door). */
function drawPit(box, g, a, bridge, t) {
  const B = box.y + box.h, far = g.by + g.bh, nearW = box.w * 0.4, farW = g.dw * 0.62;
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  poly([g.cx - farW, far + 2, g.cx + farW, far + 2, g.cx + nearW, B, g.cx - nearW, B], "#030205");
  const N = 8, n = Math.round(clamp(bridge, 0, 1) * N);
  const at = f => ({ y: B - (B - far) * f, w: nearW + (farW - nearW) * f });
  for (let i = 0; i < n; i++) {
    const p = at(i / N), q = at((i + 0.82) / N);
    poly([g.cx - p.w * 0.85, p.y, g.cx + p.w * 0.85, p.y, g.cx + q.w * 0.85, q.y, g.cx - q.w * 0.85, q.y], i % 2 ? "#8a5a2b" : "#9c6a35");
    ctx.fillStyle = "#cfd3d8"; for (const sx of [-0.5, 0.5]) { ctx.beginPath(); ctx.arc(g.cx + p.w * 0.85 * sx, (p.y + q.y) / 2, Math.max(1.5, (p.y - q.y) * 0.08), 0, Math.PI * 2); ctx.fill(); }
  }
  // Munch chewing on the end of the bridge
  const e = at(n / N);
  drawMunch(g.cx + e.w * 0.35, e.y - g.dh * 0.06, (g.dh / 420) * (1.25 - (n / N) * 0.6), t, 1);
  ctx.restore();
}

function drawDing(x, y, s, t) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 2) * 5 * s); ctx.scale(s, s);

  ctx.fillStyle = "#c7372f"; rr(-38, 2, 76, 46, 12); ctx.fill();
  ctx.fillStyle = "#f5c542"; for (let i = 0; i < 3; i++) for (const bx of [-10, 10]) { ctx.beginPath(); ctx.arc(bx, 14 + i * 12, 3, 0, Math.PI * 2); ctx.fill(); }
  // pillbox cap
  ctx.save(); ctx.translate(8, -72); ctx.rotate(0.15);

  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-12, -37, 2.5, 0, Math.PI * 2); ctx.arc(16, -37, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#222"; ctx.beginPath(); ctx.ellipse(0, -14, 8, 6 + Math.abs(Math.sin(t * 3)) * 3, 0, 0, Math.PI * 2); ctx.fill();
  // little service bell
  ctx.fillStyle = "#f5c542"; ctx.beginPath(); ctx.arc(-56, 10, 14, Math.PI, 0); ctx.fill(); ctx.fillRect(-74, 10, 36, 5); ctx.beginPath(); ctx.arc(-56, -6, 3, 0, Math.PI * 2); ctx.fill();

}
/** The door, turned into an elevator. a fades it in, open slides the doors apart. */
function drawLift(g, a, open, t) {
  const { dx, dy, dw, dh, cx } = g;
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = "#b08d3c"; rr(dx - dw * 0.1, dy - dh * 0.16, dw * 1.2, dh * 1.16, 6); ctx.fill();
  ctx.fillStyle = "#2a1f12"; ctx.fillRect(dx, dy, dw, dh);
  const warm = ctx.createLinearGradient(0, dy, 0, dy + dh); warm.addColorStop(0, "#5a4524"); warm.addColorStop(1, "#2a1f12");
  ctx.fillStyle = warm; ctx.fillRect(dx, dy, dw, dh);
  if (open > 0.05) drawDing(cx, dy + dh * 0.5, dh / 300, t);
  const w = (dw / 2) * (1 - clamp(open, 0, 1));
  const steel = ctx.createLinearGradient(dx, 0, dx + dw, 0); steel.addColorStop(0, "#6f7580"); steel.addColorStop(0.5, "#a9afba"); steel.addColorStop(1, "#6f7580");
  ctx.fillStyle = steel; ctx.fillRect(dx, dy, w, dh); ctx.fillRect(dx + dw - w, dy, w, dh);
  ctx.strokeStyle = "#4b505a"; ctx.lineWidth = 2; ctx.strokeRect(dx, dy, w, dh); ctx.strokeRect(dx + dw - w, dy, w, dh);
  // floor dial over the door
  const r = dw * 0.2, oy = dy - dh * 0.04;
  ctx.fillStyle = "#1a1410"; ctx.beginPath(); ctx.arc(cx, oy, r, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = "#f5c542"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, oy); const ang = Math.PI + 0.3 + (Math.sin(t * 1.5) * 0.5 + 0.5) * (Math.PI - 0.6); ctx.lineTo(cx + Math.cos(ang) * r * 0.85, oy + Math.sin(ang) * r * 0.85); ctx.stroke();
  ctx.restore();
}

/** Cinder: the Rattler's little lost ghost caboose, with however many cars you've hooked up so far. */
function drawCinder(x, y, s, t, cars = 0) {

  ctx.fillStyle = "#c2412f"; rr(-26, -86, 52, 38, 6); ctx.fill(); ctx.fillStyle = "#7a2418"; rr(-32, -94, 64, 10, 4); ctx.fill();
  ctx.fillStyle = "#ffe08a"; ctx.fillRect(-18, -76, 14, 14); ctx.fillRect(4, -76, 14, 14);
  // stovepipe puffing little ghost rings
  ctx.fillStyle = "#2a2a30"; ctx.fillRect(46, -76, 10, 28);
  for (let i = 0; i < 3; i++) { const p = (t * 0.7 + i / 3) % 1; ctx.strokeStyle = `rgba(190,255,230,${0.6 * (1 - p)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(51 + Math.sin(p * 5) * 6, -84 - p * 50, 5 + p * 8, 0, Math.PI * 2); ctx.stroke(); }
  // window eyes that blink, and a smile

  for (const ex of [-30, 30]) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, -8, 17, 0, Math.PI * 2); ctx.fill();
    if (blink) { ctx.strokeStyle = "#222"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ex - 10, -8); ctx.lineTo(ex + 10, -8); ctx.stroke(); }
    else { ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(ex + 2, -6, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex + 5, -9, 3, 0, Math.PI * 2); ctx.fill(); }

  ctx.restore();
}

/** Grimy: Grinny's girlfriend, the band's old lead singer. Same gator build, much better manners, and the bow. */
function drawGrimy(x, y, s, t) {

  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(34, -34, 46, -4); ctx.quadraticCurveTo(34, 24, 0, 0); ctx.fill();
  ctx.fillStyle = "#ffd1e6"; for (const bx of [-30, -20, 22, 32]) { ctx.beginPath(); ctx.arc(bx, -4 + (bx % 20 ? 6 : -6), 3.5, 0, Math.PI * 2); ctx.fill(); }

/** Grumble: the band's old tuba player, a big brown animatronic bear. wake 0 = snoring, 1 = wide awake and grumpy. */
function drawGrumble(x, y, s, t, wake = 0) {
  const breathe = Math.sin(t * 1.4) * (1 - wake);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // round sitting body and belly, with a torn patch showing the metal inside
  ctx.fillStyle = "#7a4a2a"; ctx.beginPath(); ctx.ellipse(0, 40, 74, 78 + breathe * 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#c08a5a"; ctx.beginPath(); ctx.ellipse(0, 52, 44, 52 + breathe * 3, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#d9a878"; ctx.beginPath(); ctx.ellipse(sx * 52, 115, 15, 11, 0, 0, Math.PI * 2); ctx.fill();
    for (const k of [-1, 0, 1]) { ctx.beginPath(); ctx.arc(sx * 52 + k * 11, 98, 5, 0, Math.PI * 2); ctx.fill(); }
  }
  // arms: resting on the belly when asleep, up and clawing when awake
  ctx.fillStyle = "#6b3f22";
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * 62, 18); ctx.rotate(sx * (0.5 - wake * 2.1));

    if (wake > 0.6) { ctx.fillStyle = "#f4f0e6"; for (const k of [-8, 0, 8]) poly([k - 3, 68, k + 3, 68, k, 82], "#f4f0e6"); ctx.fillStyle = "#6b3f22"; }
    ctx.restore();
  }
  // head, nodding while he snores
  ctx.save(); ctx.translate(0, -52 + breathe * 2); ctx.rotate((1 - wake) * 0.18);
  for (const sx of [-1, 1]) {
    ctx.fillStyle = "#7a4a2a"; ctx.beginPath(); ctx.arc(sx * 40, -42, 19, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c08a5a"; ctx.beginPath(); ctx.arc(sx * 40, -42, 10, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#7a4a2a"; ctx.beginPath(); ctx.arc(0, 0, 52, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#d9a878"; ctx.beginPath(); ctx.ellipse(0, 16, 28, 21, 0, 0, Math.PI * 2); ctx.fill();   // muzzle
  ctx.fillStyle = "#2a1a10"; ctx.beginPath(); ctx.ellipse(0, 6, 11, 8, 0, 0, Math.PI * 2); ctx.fill();    // nose
  if (wake > 0.6) {
    // mouth open, teeth showing
    ctx.fillStyle = "#3a0d0d"; ctx.beginPath(); ctx.ellipse(0, 26, 18, 10 + wake * 6, 0, 0, Math.PI * 2); ctx.fill();
    for (const k of [-10, 10]) poly([k - 4, 18, k + 4, 18, k, 28], "#fff8e0");
  } else {
    ctx.strokeStyle = "#2a1a10"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, 22); ctx.arc(-7, 22, 7, 0, Math.PI); ctx.moveTo(14, 22); ctx.arc(7, 22, 7, 0, Math.PI); ctx.stroke();
  }

/** Squirm: a huge worm that tunnels under the floor. The mouth is a ring of teeth. */

/** Squirm tunneling after you: a dirt mound rips up the floorboards, and the worm pops out when it's close. */

  const B = box.y + box.h, w = box.w * (0.16 + near * 0.3), cx = g.cx + Math.sin(t * 2.3) * box.w * 0.14 * (1 - near);
  const top = box.h * (0.05 + near * 0.13);

  // cracks spreading up the floor
  ctx.strokeStyle = "#140c08"; ctx.lineWidth = 3;

  ctx.fillStyle = "#5a3d27"; for (let i = 0; i < 8; i++) { const p = (t * 1.3 + i / 8) % 1; ctx.fillRect(cx + Math.sin(i * 9) * w * 0.8, B - top - p * box.h * 0.12 * (0.5 + near), 6, 6); }
  ctx.restore();
}

/** An analog clock face as inline SVG, for Cuckoo's picks. */
function clockSVG(h, m) {
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  const ticks = Array.from({ length: 12 }, (_, k) => { const a = (k * 30 * Math.PI) / 180; return `<line x1="${50 + Math.sin(a) * 38}" y1="${50 - Math.cos(a) * 38}" x2="${50 + Math.sin(a) * 44}" y2="${50 - Math.cos(a) * 44}" stroke="#2a1a0c" stroke-width="${k % 3 ? 2 : 4}"/>`; }).join("");
  const nums = [12, 3, 6, 9].map((n, k) => { const a = (k * 90 * Math.PI) / 180; return `<text x="${50 + Math.sin(a) * 30}" y="${50 - Math.cos(a) * 30 + 5}" text-anchor="middle" font-size="13" font-weight="900" fill="#2a1a0c">${n}</text>`; }).join("");
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#fffaf0" stroke="#6b4426" stroke-width="5"/>${ticks}${nums}
    <line x1="50" y1="50" x2="${50 + Math.sin((ha * Math.PI) / 180) * 22}" y2="${50 - Math.cos((ha * Math.PI) / 180) * 22}" stroke="#2a1a0c" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${50 + Math.sin((ma * Math.PI) / 180) * 36}" y2="${50 - Math.cos((ma * Math.PI) / 180) * 36}" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4" fill="#2a1a0c"/></svg>`;
}

function drawOffice(box, t) {
  const L = box.x, T = box.y, Wd = box.w, Hd = box.h;
  const lit = scene.lightsOn;

    ctx.strokeRect(mx + mw * 0.4, my + mh * 0.15, mw * 0.2, mh * 0.3);

    ctx.fillStyle = "#050a05"; ctx.fillRect(mx, my, mw, mh);

    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = "rgba(60,255,120,.07)"; ctx.fillRect(mx, my, mw, mh);

  $("#keys").classList.toggle("alg", q.mode === "alg");
  input = ""; renderInput();
  // Pre-algebra answers can be negative, so no auto-enter there: its length would give the sign away
  return new Promise((resolve, reject) => { asking = { q, opts, start: GT, resolve, reject, my, len: q.mode === "alg" ? 0 : String(q.answer).length }; });
}
function tickAsk(dt) {
  const a = asking; if (!a) return;
  if (a.my !== token) { asking = null; a.reject(new Abort()); return; }
  let out = false;
  if (a.opts.tick) out = a.opts.tick(dt);
  if (a.opts.deadline != null) {
    const left = a.opts.deadline - GT;
    if (a.opts.total) setBar(left / a.opts.total, `${Math.ceil(Math.max(0, left) / 1000)}`);
    if (left <= 0) out = true;
  }
  if (out) { asking = null; a.resolve({ ok: false, timeout: true, ms: GT - a.start }); }
}
function submit() {
  const a = asking; if (!a || !input) return;
  asking = null;
  const ok = input !== "-" && Number(input) === a.q.answer;
  a.resolve({ ok, ms: GT - a.start, value: input });
}
function press(k) {
  if (!asking || paused || document.activeElement?.tagName === "INPUT") return;
  audio();
  // Peeper: a key pressed while it's looking doesn't count
  if (asking.opts.onPress && asking.opts.onPress(k)) return;
  if (k === "del") { input = input.slice(0, -1); sfx.key(); }
  else if (k === "ok") { submit(); return; }
  else if (k === "neg") { if (asking.q.mode !== "alg") return; input = input.startsWith("-") ? input.slice(1) : "-" + input; sfx.key(); }
  else if (input.replace("-", "").length < 4) {
    input += k; sfx.key();
    // Auto-enter once the typed code is as long as the answer
    if (input.length === asking.len) { renderInput(); setTimeout(() => { if (asking && input.length === asking.len) submit(); }, 160); return; }
  }
  renderInput();
}
document.querySelectorAll("#keys button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("press"); setTimeout(() => b.classList.remove("press"), 90); press(b.dataset.k); }));
addEventListener("keydown", e => {
  if (e.repeat) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("del");
  else if (e.key === "-") press("neg");
  else if (e.key === "Enter") press("ok");
  else if (e.key === "Escape" && S.run && !document.querySelector(".screen")) openMenu();
});
function wrongFx() {
  sfx.bad(); scene.led = "#ff4d4d";

}
function rightFx() {
  sfx.good(); scene.led = "#4ade80";
  const c = $("#qcard"); c.classList.add("right"); setTimeout(() => c.classList.remove("right"), 400);
}

function playersScreen(editing = null) {
  const s = screen(`
    <h2>Who's playing?</h2>
    <div class="tag">Everyone gets their own codes, badges and best runs.</div>
    <div class="players">${P.list.map(pl => {

      const sub = `${md ? `${md.grade} ${md.label}` : ""} · ${Object.keys(sv.badges).length} badges`;
      return editing === pl.id
        ? `<div class="player on"><input id="pname" maxlength="14" value="${esc(pl.name)}" placeholder="${esc(playerName(pl))}"><button class="btn small" data-save="${pl.id}">Save</button></div>`
        : `<div class="player ${pl.id === P.cur ? "on" : ""}"><button class="who" data-pick="${pl.id}">${pl.id === P.cur ? "▶ " : ""}${esc(playerName(pl))}<small>${sub}</small></button><button class="btn small" data-edit="${pl.id}" aria-label="Rename">✏️</button></div>`;
    }).join("")}</div>
    <div class="row" style="margin-top:14px">
      ${P.list.length < 6 ? `<button class="btn small" data-a="add">➕ New player</button>` : ""}
      <button class="btn" data-a="back">← Back</button>
    </div>
  `);
  const name = s.querySelector("#pname");
  if (name) { name.focus(); name.addEventListener("keydown", e => { if (e.key === "Enter") s.querySelector("[data-save]").click(); }); }
  s.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    audio();
    if (b.dataset.pick) { if (b.dataset.pick !== P.cur) switchPlayer(b.dataset.pick); titleScreen(); return; }
    if (b.dataset.edit) { playersScreen(b.dataset.edit); return; }
    if (b.dataset.save) { const pl = P.list.find(x => x.id === b.dataset.save); pl.name = name.value.trim().slice(0, 14); savePlayers(); playersScreen(); return; }
    if (b.dataset.a === "add") {
      let n = 2; while (P.list.some(x => x.id === "p" + n)) n++;

    }
    if (b.dataset.a === "back") titleScreen();
  });
}

function flexScreen() {
  const rows = P.list.map(pl => ({ pl, sv: pl.id === P.cur ? S : load(pl.id) }));
  const fastest = Math.min(...rows.map(x => x.sv.best?.ms ?? Infinity));
  const usesAlg = sv => sv.settings.mode === "alg" || Object.keys(sv.facts).some(k => k.startsWith("g:"));
  const level = sv => usesAlg(sv) ? `🧪 Level ${sv.tier.alg}: ${ALG[sv.tier.alg - 1].name}` : `✖️ ${sv.tier.times} tables`;
  rows.sort((a, b) => (b.sv.best ? rank(b.sv.best) : -1) - (a.sv.best ? rank(a.sv.best) : -1) || (a.sv.best?.ms ?? Infinity) - (b.sv.best?.ms ?? Infinity));
  const s = screen(`
    <h2>Flex Board</h2>
    <div class="tag">Best escapes on this device. Nightmare runs rank above everything else. 👑 is the fastest escape.</div>
    <table class="flex">
      <tr><th>Player</th><th>Best escape</th><th>Unlocked</th><th>Badges</th></tr>
      ${rows.map(({ pl, sv }) => {
        const b = sv.best;
        return `<tr><td>${esc(playerName(pl))}</td><td>${b ? `${b.nm ? "😈 " : ""}${"⭐".repeat(b.stars)} · ${b.acc}% · ${fmtTime(b.ms)}${b.ms === fastest ? " 👑" : ""}` : `<span style="color:var(--dim)">no escape yet</span>`}</td><td>${level(sv)}</td><td>${Object.keys(sv.badges).length}</td></tr>`;
      }).join("")}
    </table>
    <div class="row" style="margin-top:18px"><button class="btn" data-a="back">← Back</button></div>
  `);
  s.querySelector("[data-a=back]").onclick = titleScreen;
}

function badge(id) {
  if (S.badges[id]) return;
  S.badges[id] = Date.now();
  const b = BADGES.find(x => x.id === id);
  if (b) { toast(`${b.icon} Badge: ${b.name}!`, "gold", 3200); sfx.unlock(); }
}

function makePlan(ch = 1) {
  const plan = {}, chosen = new Set();
  for (const d of [11, 21, 31, 41]) plan[d] = "shop";

  const choose = sl => {
    if (!Array.isArray(sl)) return sl;
    const unmet = sl.filter(id => !S.met[id] && !chosen.has(id) && FILES.some(f => f.id === id));
    const ev = pick(unmet.length ? unmet : sl);
    chosen.add(ev);
    return ev;
  };
  // Every slot gets a door, at least one empty door apart: share the spare doors out as random gaps
  for (const [lo, hi, slots] of PLAN_BLOCKS[ch] || PLAN_BLOCKS[1]) {
    const evs = shuffle(slots.map(choose)), k = evs.length, gaps = Array(k + 1).fill(0);
    for (let i = 0; i < hi - lo + 1 - (2 * k - 1); i++) gaps[rint(0, k)]++;
    let d = lo + gaps[0];
    evs.forEach((ev, i) => { plan[d] = ev; d += 2 + gaps[i + 1]; });
  }
  // Honcho hands out a job every ten rooms
  if (ch === 4) for (const d of [10, 20, 30, 40]) plan[d] = "honcho";
  return plan;
}

/** A believable wrong number for the fake door: the mistakes kids actually make. */
function decoy(q) {
  const a = q.answer, o = [];
  if (q.missing) o.push(a + 1, a - 1, a + 2, a - 2, a + 10);
  else if (q.op === "×") o.push(a + q.table, a - q.table, a + q.b, a - q.b);
  else if (q.mode === "alg") o.push(-a, a + 1, a - 1, a + 2);
  else o.push(a + 1, a - 1, a + 10, a - 10, a + 2);
  if (a >= 10) { const rev = +String(a).split("").reverse().join(""); if (rev !== a) o.push(rev); }
  const ok = o.filter(v => v !== a && (q.mode === "alg" || v >= 0));
  return pick(ok.length ? ok : [a + 1]);
}

const STUFF = [["key", "keys"], ["light bulb", "light bulbs"], ["rubber spider", "rubber spiders"], ["sock", "socks"], ["candle", "candles"], ["toy bat", "toy bats"]];
const pl = (n, [one, many]) => `${n} ${n === 1 ? one : many}`;
/** The same fact, told as one of Mr. Bones's counting problems. */
function storyFor(q) {
  const n = pick(STUFF), a = q.a, b = q.b;
  if (q.missing) return `Mr. Bones found a note taped to his mop. It says: ${q.ask}`;
  if (q.op === "×") return pick([
    `Mr. Bones has ${q.table} key rings with ${pl(q.b, ["key", "keys"])} on each ring. How many keys in all?`,
    `He has ${q.table} buckets with ${pl(q.b, n)} in each bucket. How many ${n[1]} is that?`,
  ]);
  if (q.op === "÷") return `He has ${pl(a, n)} to split into ${b} buckets, the same in each. How many go in each bucket?`;
  if (q.op === "+") return pick([
    `He found ${pl(a, n)} in one closet and ${b} more in another. How many ${n[1]} in all?`,
    `There are ${pl(a, n)} on his cart. He picks up ${b} more. How many now?`,
  ]);
  if (q.op === "−") return pick([
    `He had ${pl(a, n)}. He dropped ${b} down the drain. How many are left?`,
    `There were ${pl(a, n)} on the shelf. Snapjaw ate ${b}. How many are left?`,
  ]);
  return `Mr. Bones found a note taped to his mop. It says: ${q.ask || q.text + " ="}`;
}
